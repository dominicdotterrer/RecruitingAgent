name: Daily Job Digest

on:
  workflow_dispatch:        # manual trigger only — re-enable schedule once stable

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "job-search-agent[bot]"
          git config user.email "job-search-agent[bot]@users.noreply.github.com"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers (required by crawl4ai)
        run: crawl4ai-setup

      - name: Run daily digest
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BREVO_SMTP_USER:      ${{ secrets.BREVO_SMTP_USER }}
          BREVO_SMTP_PASSWORD:  ${{ secrets.BREVO_SMTP_PASSWORD }}
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
        run: python -m agent.run_daily
